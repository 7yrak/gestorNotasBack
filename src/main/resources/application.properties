spring.application.name=gestor-notas
server.port=8082
server.address=127.0.0.1

# Configuración de base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/gestor_notas?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:sergiofica}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Migraciones incrementales para instalaciones existentes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Optimización para Java 21 (Habilitar hilos virtuales para Tomcat)
spring.threads.virtual.enabled=true

# Orígenes separados por coma. Sobrescribir CORS_ALLOWED_ORIGINS en producción.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://10.51.9.17,http://localhost:4200,http://127.0.0.1:4200}

# KOVA is the only application identity provider. No local login fallback.

server.address=127.0.0.1
server.servlet.session.cookie.name=NOTES_KOVA_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=20m
notes.kova.ui-uri=https://7yrak-server.tail390d34.ts.net/gestor-notas/
notes.kova.check-uri=http://127.0.0.1:14200/kova/api/v1/sso/access
spring.security.oauth2.client.registration.kova.client-id=gestornotas-personal
spring.security.oauth2.client.registration.kova.redirect-uri=https://7yrak-server.tail390d34.ts.net/gestor-notas/login/oauth2/code/kova
spring.security.oauth2.client.provider.kova.authorization-uri=https://7yrak-server.tail390d34.ts.net/kova/oauth2/authorize
spring.security.oauth2.client.provider.kova.token-uri=http://127.0.0.1:14200/kova/oauth2/token
spring.security.oauth2.client.provider.kova.jwk-set-uri=http://127.0.0.1:14200/kova/oauth2/jwks
spring.security.oauth2.client.provider.kova.issuer-uri=https://7yrak-server.tail390d34.ts.net/kova
