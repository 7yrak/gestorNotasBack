name: Local access
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: notes_customer
          POSTGRES_USER: kova_test
          POSTGRES_PASSWORD: notes-ci-disposable-only
        ports: ['15548:5432']
        options: >-
          --health-cmd "pg_isready -U kova_test -d notes_customer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KOVA_NOTES_TEST_DB_PASSWORD: notes-ci-disposable-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: mvn -B -ntp package
